[versions]
# App versioning - update these for all apps and tag the release with vX.Y.Z.
versionCode = "1"
versionName = "0.1.0"

agp = "9.1.0"
coreKtx = "1.18.0"
activity = "1.13.0"
media = "1.7.0"
geckoview = "160.0.20261104181552"
# AGP 9.1 bundles Kotlin 2.2, which cannot read GeckoView's Kotlin 2.4 metadata.
# The Compose plugin pins Kotlin 2.3.20 as a workaround; see AGENTS.md.
kotlin = "2.3.20"
composeBom = "2026.03.01"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }
geckoview = { group = "org.mozilla.geckoview", name = "geckoview", version.ref = "geckoview" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
